name: Auto Renew HidenCloud 

on:
  workflow_dispatch:
  schedule:
    - cron: '22 3 1 10 *'   # 自动更新下次运行时间

permissions:
  actions: write
  contents: write

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py 2>&1 | tee renew.log

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      # 更新时间到time.txt,避免6个月未更新导致工作流暂停
      - name: 🕒 更新时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push || git push --force-with-lease || true
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 提取到期时间
        id: extract_due
        if: success()
        run: |
          DUE_DATE=$(grep -oP '到期时间\(标准\): \K\d{4}-\d{2}-\d{2}' renew.log | tail -1 || echo "")
          if [ -z "$DUE_DATE" ]; then
            echo "skip_update=true" >> $GITHUB_OUTPUT
            echo "::warning::未能提取到期时间，跳过 Cron 更新"
            exit 0
          fi
          echo "due_date=$DUE_DATE" >> $GITHUB_OUTPUT
          echo "skip_update=false" >> $GITHUB_OUTPUT
          echo "::notice::📅 当前到期时间: $DUE_DATE"

      - name: 修改下次 Cron 时间
        if: success() && steps.extract_due.outputs.skip_update != 'true'
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -e

          # 未配置 REPO_TOKEN 则跳过（if 中不能直接引用 secrets 上下文）
          if [ -z "$REPO_TOKEN" ]; then
            echo "::warning::未配置 REPO_TOKEN，跳过自动更新 Cron"
            exit 0
          fi

          DUE_DATE="${{ steps.extract_due.outputs.due_date }}"
          echo "📅 当前到期时间: $DUE_DATE"

          CURRENT_EPOCH=$(date -u +%s)
          DUE_EPOCH=$(date -u -d "$DUE_DATE 00:00:00" +%s)
          REMAINING_SECONDS=$((DUE_EPOCH - CURRENT_EPOCH))

          REMAINING_HOURS_DISPLAY=$(echo "scale=2; $REMAINING_SECONDS / 3600" | bc)
          echo "⏳ 距离到期还有 $REMAINING_HOURS_DISPLAY 小时"

          REMAINING_HOURS_INT=$((REMAINING_SECONDS / 3600))

          if [ "$REMAINING_HOURS_INT" -gt 20 ]; then
            HOURS_UNTIL_NEXT_RUN=$((REMAINING_HOURS_INT - 20))
          else
            HOURS_UNTIL_NEXT_RUN=4
            echo "::warning::剩余时间不足 20 小时，4 小时后重试"
          fi

          NEXT_DATE=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%Y-%m-%d %H:%M")
          NEXT_MINUTE=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-M")
          NEXT_HOUR=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-H")
          NEXT_DAY=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-d")
          NEXT_MONTH=$(date -u -d "+${HOURS_UNTIL_NEXT_RUN} hours" +"%-m")

          NEW_CRON="$NEXT_MINUTE $NEXT_HOUR $NEXT_DAY $NEXT_MONTH *"

          echo "::notice::⏰ 下次运行: $NEXT_DATE UTC"
          echo "::notice::📟 新 Cron: $NEW_CRON"

          git clone https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git workflow_repo
          cd workflow_repo

          WORKFLOW_FILE=".github/workflows/renew.yml"

          LINE_NUM=$(grep -n "cron: '" "$WORKFLOW_FILE" | head -n1 | cut -d: -f1)

          if [ -z "$LINE_NUM" ]; then
            echo "::error::找不到 cron 行"
            exit 1
          fi

          echo "::notice::更新第 $LINE_NUM 行"

          sed -i "${LINE_NUM}c\\    - cron: '$NEW_CRON'   # 自动更新下次运行时间" "$WORKFLOW_FILE"

          if git diff --quiet "$WORKFLOW_FILE"; then
            echo "::notice::没有变化需要提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$WORKFLOW_FILE"
          git commit -m "🔄 自动更新 HidenCloud 续期 Cron" \
                     -m "下次运行: $NEXT_DATE UTC" \
                     -m "Cron: $NEW_CRON" \
                     -m "到期时间: $DUE_DATE"
          git push

          echo "::notice::✅ Cron 更新成功"
